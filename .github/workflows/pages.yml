name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# NOTE: This workflow needs Pages enabled once in the GitHub UI:
#   Settings → Pages → Build and deployment → Source: GitHub Actions → Save
# Until then, configure-pages fails. Content is already on main; branch deploy also works:
#   Settings → Pages → Deploy from a branch → main → / (root) → Save
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
