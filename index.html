<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Smart Masjid Clock: offline prayer-time and jamaat alarms for Android.">
<title>Smart Masjid Clock</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d2421; --muted: #55605b; --accent: #0f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121614; --fg: #e5ebe7; --muted: #a3b0a9; --accent: #6fd3ad; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 10px 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1>Smart Masjid Clock</h1>
  <p>Prayer times for any place in the world, jamaat alarms and automatic silence during prayers, for Android. It works offline,
    with no account and no advertising.</p>
  <p><a href="privacy/">Privacy policy</a></p>
  <p class="muted">City data: <a href="https://www.geonames.org">GeoNames</a>, CC BY 4.0.</p>
</main>
</body>
</html>
